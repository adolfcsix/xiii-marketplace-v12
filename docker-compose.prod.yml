services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    expose: ["4000"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        APP: web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL}
        NEXT_PUBLIC_SELLER_URL: ${SELLER_URL}
    restart: unless-stopped
    expose: ["3000"]
    security_opt: ["no-new-privileges:true"]

  seller:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        APP: seller
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL}
        NEXT_PUBLIC_SELLER_URL: ${SELLER_URL}
    restart: unless-stopped
    expose: ["3000"]
    security_opt: ["no-new-privileges:true"]

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        APP: admin
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL}
        NEXT_PUBLIC_SELLER_URL: ${SELLER_URL}
    restart: unless-stopped
    expose: ["3000"]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-lc", "redis-server --appendonly yes --requirepass '$${REDIS_PASSWORD}'"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis_prod:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
      seller: { condition: service_started }
      admin: { condition: service_started }
    ports: ["80:80"]
    volumes:
      - ./ops/nginx/xiii.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/proxy_params:/etc/nginx/proxy_params:ro
    security_opt: ["no-new-privileges:true"]

volumes:
  redis_prod:
