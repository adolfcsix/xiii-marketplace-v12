map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream xiii_web { server web:3000; }
upstream xiii_seller { server seller:3000; }
upstream xiii_admin { server admin:3000; }
upstream xiii_api { server api:4000; }

server {
  listen 80;
  server_name xiii.example.com;
  client_max_body_size 2m;
  location / { proxy_pass http://xiii_web; include /etc/nginx/proxy_params; }
}
server {
  listen 80;
  server_name seller.xiii.example.com;
  client_max_body_size 2m;
  location / { proxy_pass http://xiii_seller; include /etc/nginx/proxy_params; }
}
server {
  listen 80;
  server_name admin.xiii.example.com;
  client_max_body_size 2m;
  location / { proxy_pass http://xiii_admin; include /etc/nginx/proxy_params; }
}
server {
  listen 80;
  server_name api.xiii.example.com;
  client_max_body_size 2m;
  location /socket.io/ {
    proxy_pass http://xiii_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://xiii_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
